<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkBuddy Pet</title>
<link rel="stylesheet" href="web/pet.css">
</head>
<body>

<!-- 桌面宠物独立页面：只有角色本体，没有 HUD / 面板 / Dashboard。
     由 desktop/WorkBuddyPet.app（Swift + WKWebView 透明窗口）加载。
     也可直接用浏览器打开调试。 -->

<div class="pet" id="pet" data-state="idle">

  <!-- 角色与两条铭牌共用的坐标系，尺寸恒等于精灵画布。
       2026-10-26：原来标签直接贴窗口边缘（top:17 / bottom:0），
       而角色尺寸是固定 200px 画布。Windows 跨缩放屏拖动时窗口 DIP
       尺寸会被系统改掉，角色不动、标签跟着窗口跑 —— 用户看到的就是
       「抓着宠物一拖，已花费的标签自己往上飘」。
       现在两者共用 .pet-stage 这个盒子，窗口怎么变都不影响相对位置。 -->
  <div class="pet-stage">

    <div class="pet-body" id="petBody">
      <div class="pet-inner">
        <!-- 精灵图取帧（S2 之前固定显示 idle 第 1 帧） -->
        <div class="pet-sprite" id="petSprite"></div>
      </div>

      <!-- 状态特效浮在头顶的画布留白区里，不占额外窗口空间 -->
      <div class="pet-fx">
        <span class="fx-dots"><i></i><i></i><i></i></span>
        <span class="fx-ring"></span>
        <span class="fx-mark">!</span>
        <span class="fx-check">✓</span>
      </div>
    </div>

    <!-- 两条铭牌刻意放在 petBody **外面**：它们的点击不能触发拖动/菜单 -->
    <div class="pet-summary" id="petSummary">
      <span id="petCost" title="未接入真实账单">已花费 —</span>
    </div>
    <div class="pet-meter">
      <button type="button" id="petTokens" title="今日全部工具 Token；点击轮换来源">今日 读取中…</button>
    </div>
  </div>
</div>

<!-- manifest 用 <script> 加载：file:// 下 fetch 会被 CORS 拦，
     这样"双击本文件直接看"也能拿到全部剪辑（否则只剩 idle）。
     manifest.js 由 build-manifest-js.py 从 manifest.json 生成。 -->
<script src="assets/pet/manifest.js"></script>
<script src="web/pet-runtime.js"></script>
<script src="web/pet.js"></script>
</body>
</html>
