<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>pet-bridge-selftest</title>
<link rel="stylesheet" href="web/pet.css">
</head><body>

<!-- 宿主 ↔ 网页 桥的回归测试。
     这一层是**跨进程契约**（Swift 用 evaluateJavaScript 调 window.petHostEvent），
     平时完全没有覆盖，最容易在改一边的时候悄悄断掉。
     用真实 manifest（manifest.js）+ 真实 pet.js，断言的是**渲染结果**，不是内部字段。
     双击本文件即可跑（不需要 daemon），结果写在 document.title。 -->

<div class="pet" id="pet" data-state="idle">
  <div class="pet-body" id="petBody">
    <div class="pet-inner"><div class="pet-sprite" id="petSprite"></div></div>
    <div class="pet-fx">
      <span class="fx-dots"><i></i><i></i><i></i></span>
      <span class="fx-ring"></span><span class="fx-mark">!</span><span class="fx-check">✓</span>
    </div>
  </div>
</div>

<script src="assets/pet/manifest.js"></script>
<script>
// 让本测试**自足**：把 fetch 掐掉，不依赖本机有没有跑状态服务。
// 否则 pet.js 的轮询会真的去连 127.0.0.1:8791，无头浏览器会因为
// 定时器一直有活干而永不退出（实测被卡住过），而且在没跑服务的机器上结果还不一样。
window.fetch = function () { return Promise.reject(new Error('offline')); };
</script>
<script src="web/pet-runtime.js"></script>
<script src="web/pet.js"></script>
<script>
(function () {
  var out = [], P = 1, F = 0;
  function ok(name, cond, got) {
    if (cond) { P++; } else { F++; out.push('FAIL:' + name + '(' + got + ')'); }
  }

  var root = document.getElementById('pet');
  var sprite = document.getElementById('petSprite');
  function flip() { return root.style.getPropertyValue('--pet-flip'); }
  function sheet() { return sprite.style.backgroundImage || ''; }

  setTimeout(function () {
    ok('window.petHostEvent 已导出（宿主靠它驱动网页）',
       typeof window.petHostEvent === 'function', typeof window.petHostEvent);

    ok('真实清单里有 run 剪辑（否则跑步会被静默跳过）',
       !!(window.PET_MANIFEST && window.PET_MANIFEST.clips && window.PET_MANIFEST.clips.run),
       window.PET_MANIFEST && Object.keys(window.PET_MANIFEST.clips).join(','));

    ok('run 声明了 flipForLeft',
       !!(window.PET_MANIFEST.clips.run || {}).flipForLeft,
       (window.PET_MANIFEST.clips.run || {}).flipForLeft);

    // 向左跑：必须切到 run 的 sheet，并且水平翻转
    window.petHostEvent('runStart', { dir: -1, durationMs: 400 });
    ok('向左跑切到 run 的图集', sheet().indexOf('run.png') !== -1, sheet().slice(-40));
    ok('向左跑写入 --pet-flip=-1（CSS 靠它做 scaleX）', flip() === '-1', flip());

    // 向右跑：同一剪辑，不翻转
    window.petHostEvent('runStart', { dir: 1, durationMs: 400 });
    ok('向右跑切到 run 的图集', sheet().indexOf('run.png') !== -1, sheet().slice(-40));
    ok('向右跑 --pet-flip=1', flip() === '1', flip());

    // 跑动结束：宿主显式收尾，必须回到状态剪辑并复位朝向
    window.petHostEvent('runEnd', {});
    ok('跑完离开 run 图集', sheet().indexOf('run.png') === -1, sheet().slice(-40));
    ok('跑完朝向复位为 1', flip() === '1', flip());

    // 缺参数 / 未知事件不能让页面炸掉（宿主版本不一致时会遇到）
    var survived = true;
    try {
      window.petHostEvent('runStart', {});
      window.petHostEvent('unknownEvent', null);
      window.petHostEvent('runEnd');
    } catch (e) { survived = false; }
    ok('参数缺失或未知事件不抛异常', survived, survived ? '' : 'threw');
    ok('异常事件后朝向仍为 1', flip() === '1', flip());

    document.title = 'RESULT|PASS=' + P + '|FAIL=' + F +
                     (out.length ? '|' + out.join('|') : '|ALL_OK');
  }, 300);
})();
</script>
</body></html>
