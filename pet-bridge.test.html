<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>pet-bridge-selftest</title>
<link rel="stylesheet" href="web/pet.css">
</head><body>

<!-- 宿主 ↔ 网页 桥的回归测试。
     这一层是**跨进程契约**（Swift 用 evaluateJavaScript 调 window.petHostEvent，
     网页用 postMessage 发指令给宿主），平时完全没有覆盖，最容易在改一边时悄悄断掉。

     做法：装一个**假宿主**（window.webkit.messageHandlers.petHost）拦截所有发出去的指令，
     于是"右键是否真的发了 menu""双击是否发了 menu"这种问题可以断言，不用靠手点。

     用真实 manifest（manifest.js）+ 真实 pet.js；断言的是**发出去的指令**和**渲染结果**。
     双击本文件即可跑（不需要 daemon），结果写在 document.title。 -->

<div class="pet" id="pet" data-state="idle">
  <div class="pet-body" id="petBody">
    <div class="pet-inner"><div class="pet-sprite" id="petSprite"></div></div>
    <div class="pet-fx">
      <span class="fx-dots"><i></i><i></i><i></i></span>
      <span class="fx-ring"></span><span class="fx-mark">!</span><span class="fx-check">✓</span>
    </div>
  </div>
</div>

<script src="assets/pet/manifest.js"></script>
<script>
// ⚠️ 假宿主必须在 pet.js 之前装好：pet.js 在加载时就读取
// window.webkit.messageHandlers.petHost 来决定 IS_DESKTOP。
window.__sent = [];
window.webkit = { messageHandlers: { petHost: { postMessage: function (m) {
  window.__sent.push(m);
} } } };

// 让本测试自足：掐掉 fetch，不依赖本机有没有跑状态服务。
window.fetch = function () { return Promise.reject(new Error('offline')); };
</script>
<script src="web/pet-runtime.js"></script>
<script src="web/pet.js"></script>
<script>
(function () {
  var out = [], P = 1, F = 0;
  function ok(name, cond, got) {
    if (cond) { P++; } else { F++; out.push('FAIL:' + name + '(' + got + ')'); }
  }

  var root = document.getElementById('pet');
  var body = document.getElementById('petBody');
  var sprite = document.getElementById('petSprite');
  function flip() { return root.style.getPropertyValue('--pet-flip'); }
  function sheet() { return sprite.style.backgroundImage || ''; }
  function cmds() { return window.__sent.map(function (m) { return m.cmd; }); }
  function lastCmd() { var c = cmds(); return c.length ? c[c.length - 1] : ''; }
  function clear() { window.__sent.length = 0; }
  function ptr(type, x, y, button) {
    body.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true,
      button: button || 0, pointerId: 1, clientX: x || 40, clientY: y || 40,
      screenX: 400, screenY: 400, isPrimary: true }));
  }
  function click() { ptr('pointerdown'); ptr('pointerup'); }
  function wait(ms, fn) { setTimeout(fn, ms); }

  setTimeout(function () {
    // ---- 桥本身 ----
    ok('window.petHostEvent 已导出（宿主靠它驱动网页）',
       typeof window.petHostEvent === 'function', typeof window.petHostEvent);
    // 真正证明"网页 → 宿主"这条通道通着：点她一下，宿主应当收到 clicked
    clear();
    click();
    ok('页面能把指令发给宿主（点一下 → 宿主收到 clicked）',
       lastCmd() === 'clicked', cmds().join(','));
    ok('真实清单里有 run 剪辑（否则跑步会被静默跳过）',
       !!(window.PET_MANIFEST.clips.run), Object.keys(window.PET_MANIFEST.clips).join(','));
    ok('run 声明了 flipForLeft', !!window.PET_MANIFEST.clips.run.flipForLeft,
       window.PET_MANIFEST.clips.run.flipForLeft);

    // ---- 宿主 → 网页 ----
    window.petHostEvent('runStart', { dir: -1, durationMs: 400 });
    ok('向左跑切到 run 的图集', sheet().indexOf('run.png') !== -1, sheet().slice(-40));
    ok('向左跑写入 --pet-flip=-1（CSS 靠它做 scaleX）', flip() === '-1', flip());

    window.petHostEvent('runStart', { dir: 1, durationMs: 400 });
    ok('向右跑 --pet-flip=1', flip() === '1', flip());

    window.petHostEvent('runEnd', {});
    ok('跑完离开 run 图集', sheet().indexOf('run.png') === -1, sheet().slice(-40));
    ok('跑完朝向复位为 1', flip() === '1', flip());

    var survived = true;
    try {
      window.petHostEvent('runStart', {});
      window.petHostEvent('unknownEvent', null);
      window.petHostEvent('runEnd');
    } catch (e) { survived = false; }
    ok('参数缺失或未知事件不抛异常', survived, survived ? '' : 'threw');

    // ---- 网页 → 宿主：右键 / 双击 = 复位（不弹菜单）----
    // 回归①：contextmenu 在 WKWebView 里**不触发**（日志证据：用户的点击一堆，
    //        menu 一次都没有），所以右键改由 pointerdown 的 button===2 触发。
    // 回归②：用户要求"跑动不要出现在菜单里"→ 双击/右键都应该是**直接复位**，
    //        而不是去开菜单。
    clear();
    ptr('pointerdown', 40, 40, 2);
    ok('右键发出 reset 指令（复位，不是开菜单）', lastCmd() === 'reset', cmds().join(','));
    ok('右键不应弹菜单', cmds().indexOf('menu') === -1, cmds().join(','));
    ok('右键不应被当成拖拽', cmds().indexOf('dragBegin') === -1, cmds().join(','));

    // ---- 网页 → 宿主：单击 / 双击 / 拖拽 ----
    wait(450, function () {                       // 先隔开，避免和上一次算双击
      clear();
      click();
      ok('单击发出 clicked（角色反应）', lastCmd() === 'clicked', cmds().join(','));

      clear();
      click();                                    // 双击的第一下
      click();                                    // 第二下 → 复位
      ok('双击发出 reset 指令（复位）', lastCmd() === 'reset', cmds().join(','));
      ok('双击不弹菜单', cmds().indexOf('menu') === -1, cmds().join(','));

      clear();
      ptr('pointerdown', 40, 40);
      ptr('pointermove', 90, 70);
      ptr('pointerup', 90, 70);
      var c = cmds().join(',');
      ok('拖拽发出 dragBegin', c.indexOf('dragBegin') !== -1, c);
      ok('拖拽移动发出 dragMove', c.indexOf('dragMove') !== -1, c);
      ok('松手发出 dragEnd', c.indexOf('dragEnd') !== -1, c);
      ok('拖动过就不该再发 clicked', c.indexOf('clicked') === -1, c);

      document.title = 'RESULT|PASS=' + P + '|FAIL=' + F +
                       (out.length ? '|' + out.join('|') : '|ALL_OK');
    });
  }, 300);
})();
</script>
</body></html>
