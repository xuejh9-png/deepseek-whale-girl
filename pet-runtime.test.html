<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>pet-runtime-selftest</title>
<link rel="stylesheet" href="web/pet.css">
</head><body>

<!-- 动画运行时回归测试。
     直接双击用浏览器打开即可（不需要 daemon），结果写在 document.title。
     合成 manifest 覆盖三类情形：循环剪辑 / 一次性剪辑 / 缺失剪辑。 -->

<div class="pet" id="pet" data-state="idle">
  <div class="pet-body" id="petBody">
    <div class="pet-inner"><div class="pet-sprite" id="petSprite"></div></div>
    <div class="pet-fx">
      <span class="fx-dots"><i></i><i></i><i></i></span>
      <span class="fx-ring"></span><span class="fx-mark">!</span><span class="fx-check">✓</span>
    </div>
  </div>
</div>

<script src="web/pet-runtime.js"></script>
<script>
(function () {
  var out = [], P = 1, F = 0;
  // 每个剪辑用【不同的】1px SVG —— 这样才能验证 background-image 有没有真的切过去
  function sheet(color) {
    return 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">' +
      '<rect width="20" height="20" fill="' + color + '"/></svg>');
  }
  var C = { idle:'#111', work:'#222', sleep:'#333', click:'#444', jump:'#555', drag:'#666' };

  function ok(name, cond, got) {
    if (cond) { P++; } else { F++; out.push('FAIL:' + name + '(' + got + ')'); }
  }

  var MAN = {
    version: 5,
    spriteSheet: { frameWidth: 320, frameHeight: 400, columns: 6 },
    clips: {
      idle:  { file: sheet(C.idle),  frameCount: 20, rows: 4, fps: 10, loop: true,  loopStart: 1,  loopEnd: 20 },
      work:  { file: sheet(C.work),  frameCount: 12, rows: 2, fps: 10, loop: true,  loopStart: 5,  loopEnd: 12 },
      sleep: { file: sheet(C.sleep), frameCount: 12, rows: 2, fps: 6,  loop: true,  loopStart: 9,  loopEnd: 12 },
      click: { file: sheet(C.click), frameCount: 8,  rows: 2, fps: 12, loop: false, loopStart: null, loopEnd: null },
      jump:  { file: sheet(C.jump),  frameCount: 14, rows: 3, fps: 14, loop: false, loopStart: null, loopEnd: null, airborneFrame: 7 },
      drag:  { file: sheet(C.drag),  frameCount: 12, rows: 2, fps: 10, loop: true,  loopStart: 5,  loopEnd: 12 }
    }
  };

  var anim = new PetAnimation({
    spriteEl: document.getElementById('petSprite'),
    rootEl: document.getElementById('pet'),
    basePath: '', manifestUrl: 'data:application/json,{}'
  });
  anim.manifest = MAN;

  // 当前画面上到底是哪张 sheet（不是内部 clipName —— 这两者曾经不一致）
  function bgOf() { return anim.el.style.backgroundImage || ''; }
  // data URI 里的 # 会被编码成 %23，所以比对编码后的形式
  function bgHas(color) { return bgOf().indexOf(encodeURIComponent(color)) !== -1; }

  function tick(ms, step) {
    step = step || 10;
    for (var t = 0; t < ms; t += step) anim.tick(step);
  }

  anim.playClip('idle');
  tick(1000);
  ok('idle 1 秒推进 10 帧', anim.frame === 10, anim.frame);

  tick(1000);
  ok('idle 回卷到第 1 帧', anim.frame >= 0 && anim.frame < 20, anim.frame);

  anim.playClip('work');
  anim.frame = 11;
  tick(100);
  ok('work 末帧(12)→循环段首帧(5)', anim.frame === 4, anim.frame);

  var early = false;
  anim.frame = 4;
  for (var i = 0; i < 40; i++) { tick(100); if (anim.frame < 4) early = true; }
  ok('work 全程不进开场段(1-4)', !early, anim.frame);

  anim.playClip('sleep');
  anim.frame = 11; tick(1000 / 6 + 1);
  ok('sleep 回卷到第 9 帧', anim.frame === 8, anim.frame);

  anim.setState('idle');
  anim.playClip('click', { once: true });
  var reachedLast = false, returned = false;
  for (var k = 0; k < 300; k++) {
    anim.tick(10);
    if (anim.clipName === 'click' && anim.frame === 7) reachedLast = true;
    if (anim.clipName === 'idle' && anim.action === null) { returned = true; break; }
  }
  ok('click 播到过末帧(第8帧)', reachedLast, anim.frame);
  ok('click 播完自动回到 idle', returned, anim.clipName + '/' + anim.action);

  anim.setState('success');
  ok('缺剪辑退化为 idle', anim.clipName === 'idle', anim.clipName);
  ok('缺剪辑时 data-fallback=1', anim.root.dataset.fallback === '1', anim.root.dataset.fallback);

  anim.setState('working');
  ok('有剪辑时 data-fallback=0', anim.root.dataset.fallback === '0', anim.root.dataset.fallback);
  ok('working 映射到 work', anim.clipName === 'work', anim.clipName);

  anim.setState('thinking');
  var before = anim.clipName;
  anim.trigger('clicked', true);
  ok('触发动作后切到 click', anim.clipName === 'click', anim.clipName);
  tick(2000);
  ok('动作播完回到状态剪辑', anim.clipName === before, anim.clipName);

  anim.trigger('released', true);
  ok('released 从第 7 帧起播', anim.frame === 6, anim.frame);

  var n0 = anim.clipName;
  anim.trigger('runLeft', true);
  ok('无素材的动作被跳过', anim.clipName === n0, anim.clipName);

  // ---- 12. 抓取 → 松手 → 必须落地 ----
  // 回归：drag 剪辑是无限循环的，松手时若不打断当前动作，
  // 排队的 released 永远不会启动 → 角色一直吊在半空不落地（实际发生过的 bug）
  anim.setState('idle');
  anim.clearActions();
  anim.trigger('grabbed', true);
  ok('抓起后进入 drag 剪辑', anim.clipName === 'drag', anim.clipName);
  tick(3000);
  ok('drag 无限循环（action 一直占着）',
     anim.action && anim.action.name === 'grabbed', anim.action && anim.action.name);

  anim.trigger('released', true);          // 松手
  ok('松手立刻打断并切到 jump', anim.clipName === 'jump', anim.clipName);
  ok('released 从 airborneFrame 起播', anim.frame === 6, anim.frame);

  tick(3000);                              // jump 播完
  ok('落地后自动回到 idle',
     anim.clipName === 'idle' && anim.action === null,
     anim.clipName + '/' + (anim.action && anim.action.name));

  // ---- 13. 缺素材的动作不能卡住队列 ----
  anim.clearActions();
  anim.trigger('runLeft', true);           // run 不在合成清单里
  anim.trigger('clicked', true);           // 后续动作仍应能启动
  ok('缺素材动作不阻塞后续动作', anim.clipName === 'click', anim.clipName);

  // ---- 13b. 朝向：manifest 声明 flipForLeft 的剪辑，向左播必须真翻转 ----
  // 回归：`flipForLeft` 一直在 manifest 里声明、ASSET_SPEC 也写了，
  // 但运行时从来没实现过 —— 向左跑会变成"倒着滑"。
  // ⚠️ 必须断言**真正写进 DOM 的 --pet-flip**（CSS 靠它做 scaleX），
  //    只断言 clipName / facing 内部字段是抓不到这个 bug 的。
  var MAN2 = JSON.parse(JSON.stringify(MAN));
  MAN2.clips.run = { file: sheet('#777'), frameCount: 12, rows: 2, fps: 16,
                     loop: true, loopStart: 1, loopEnd: 12, flipForLeft: true };
  var anim2 = new PetAnimation({
    spriteEl: document.getElementById('petSprite'),
    rootEl: document.getElementById('pet'),
    basePath: '', manifestUrl: 'data:application/json,{}'
  });
  anim2.manifest = MAN2;
  function flip() { return anim2.root.style.getPropertyValue('--pet-flip'); }

  anim2.setState('idle');
  anim2.trigger('runRight', true);
  ok('向右跑不翻转', anim2.clipName === 'run' && flip() === '1',
     anim2.clipName + '/flip=' + flip());

  anim2.trigger('runLeft', true);
  ok('向左跑水平翻转', flip() === '-1', 'flip=' + flip());
  ok('向左跑确实在播 run', anim2.clipName === 'run', anim2.clipName);

  anim2.clearActions();                   // 宿主在跑动结束时调的就是这个
  ok('跑完回到状态剪辑且朝向复位', anim2.clipName === 'idle' && flip() === '1',
     anim2.clipName + '/flip=' + flip());

  anim2.trigger('clicked', true);         // 未声明 flipForLeft 的剪辑
  ok('未声明 flipForLeft 的剪辑不翻转', flip() === '1', 'flip=' + flip());

  // ---- 14. 画面上到底是不是当前剪辑的 sheet ----
  // 回归：曾经只在"首次加载"时设 backgroundImage，
  // 切回已缓存的剪辑就沿用上一张 sheet —— 帧号按新剪辑走、画面却是旧剪辑，
  // 症状是 jump 播完切回 work，却一直显示 jump 的落地帧在循环。
  // ⚠️ 这一项必须断言「实际渲染」，只断言 clipName 是抓不到的。
  var names = Object.keys(MAN.clips);
  names.forEach(function (n) { anim.playClip(n); });      // 触发全部加载
  setTimeout(function () {
    anim.playClip('idle');        tick(60);
    ok('画面 = idle sheet',  bgHas(C.idle), bgOf().slice(0, 60));
    anim.playClip('work');        tick(60);
    ok('画面 = work sheet',  bgHas(C.work), bgOf().slice(0, 60));
    anim.playClip('idle');        tick(60);
    ok('切回已加载过的 idle，画面跟着换', bgHas(C.idle), bgOf().slice(0, 60));
    anim.playClip('jump', { once: true, from: 7 }); tick(60);
    ok('画面 = jump sheet',  bgHas(C.jump), bgOf().slice(0, 60));

    // 模拟真实回归路径：jump 播完 → applyState() 切回 work（work 早已缓存）
    anim.setState('working');
    tick(2000);
    ok('jump 播完切回工作态，画面必须换成 work sheet',
       bgHas(C.work), 'img=' + (bgHas(C.jump) ? 'jump(旧)' : bgHas(C.idle) ? 'idle' : '?') +
                      ' clip=' + anim.clipName);
    ok('且确实停在 work 剪辑', anim.clipName === 'work', anim.clipName);

    document.title = 'RESULT|PASS=' + P + '|FAIL=' + F + (out.length ? '|' + out.join('|') : '|ALL_OK');
  }, 500);
})();
</script>
</body></html>
