name: build-windows

# 在 Windows 机器上打出安装包 —— 这样用户不需要装 Node，直接下 exe。
# 手动触发：Actions 页面点 Run workflow；打 tag（v*）时自动跑并挂到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 数据层回归（不需要 Electron）
        run: node test-claude-code.js

      - name: 打包 NSIS 安装包
        run: npm run dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyPet-win-x64
          path: windows/dist/*.exe
          if-no-files-found: error

      - name: 挂到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.exe
